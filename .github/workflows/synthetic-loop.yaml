name: Diagnostic bridge
on:
  pull_request:
    paths:
      - 'cloud/synthetic-loop/**'
      - '.github/workflows/synthetic-loop.yaml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cloud/synthetic-loop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:panel
  official-tunnel-local-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cloud/synthetic-loop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build:panel
      - name: Download and verify official runtime-only client for isolated local test
        run: |
          curl --fail --location --max-time 90 https://github.com/openai/tunnel-client/releases/download/v0.0.15/tunnel-client-runtime-v0.0.15-linux-amd64.zip -o "$RUNNER_TEMP/tunnel-client-runtime.zip"
          printf '%s  %s\n' f26f8b3ee6c335e38fa5cfbe6ce5635f53738f08a26eecf07d6cebacab4a1abf "$RUNNER_TEMP/tunnel-client-runtime.zip" | sha256sum --check
          unzip "$RUNNER_TEMP/tunnel-client-runtime.zip" tunnel-client-runtime -d "$RUNNER_TEMP/stats-official-client"
          node tunnel/verify-client.mts "$RUNNER_TEMP/stats-official-client/tunnel-client-runtime"
      - name: Verify credential-free MCP 2.0 transport
        run: TUNNEL_CLIENT_BIN="$RUNNER_TEMP/stats-official-client/tunnel-client-runtime" npm run test:official-tunnel
      - name: Verify private socket synthetic and real-schema fixture transport
        run: TUNNEL_CLIENT_BIN="$RUNNER_TEMP/stats-official-client/tunnel-client-runtime" npm run test:private-runtime
