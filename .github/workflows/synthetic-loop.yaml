name: Diagnostic bridge
on:
  pull_request:
    paths:
      - 'cloud/synthetic-loop/**'
      - '.github/workflows/synthetic-loop.yaml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cloud/synthetic-loop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
  official-tunnel-local-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cloud/synthetic-loop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download and verify official client for isolated local test
        run: |
          curl --fail --location --max-time 90 https://github.com/openai/tunnel-client/releases/download/v0.0.15/tunnel-client-v0.0.15-linux-amd64.zip -o "$RUNNER_TEMP/tunnel-client.zip"
          printf '%s  %s\n' 8c836dc5d68d68b663d9a5c5b28ff9fa780d9f7a3fffb1c306880b8f32fab5f1 "$RUNNER_TEMP/tunnel-client.zip" | sha256sum --check
          unzip "$RUNNER_TEMP/tunnel-client.zip" tunnel-client -d "$RUNNER_TEMP/stats-official-client"
      - name: Verify credential-free MCP 2.0 transport
        run: TUNNEL_CLIENT_BIN="$RUNNER_TEMP/stats-official-client/tunnel-client" npm run test:official-tunnel
      - name: Verify private socket synthetic and real-schema fixture transport
        run: TUNNEL_CLIENT_BIN="$RUNNER_TEMP/stats-official-client/tunnel-client" npm run test:private-runtime
