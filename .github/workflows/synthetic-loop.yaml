name: Synthetic bridge
on:
  pull_request:
    paths:
      - 'cloud/synthetic-loop/**'
      - '.github/workflows/synthetic-loop.yaml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cloud/synthetic-loop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
